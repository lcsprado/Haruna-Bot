name: Playable heroes baseline comparison

on:
  push:
    branches: ['web-integration-playable-seven-sins-20261027']
    paths:
      - '.github/workflows/playable-heroes-baseline.yml'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Switch to original compact classes branch (read only)
        run: git checkout web-integration-compact-classes-20261027
      - name: Temporary dependency install without lockfile change
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Baseline suite, exact same npm test
        run: npm test
