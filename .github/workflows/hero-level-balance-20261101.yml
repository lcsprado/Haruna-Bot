name: Hero level balance - focused validation

on:
  pull_request:
    paths:
      - 'src/neon/playable-heroes-core.js'
      - 'test/playable-seven-sins-20261027.test.mjs'
      - 'test/hero-hp-cura-pvp-20261031.test.mjs'
      - '.github/workflows/hero-level-balance-20261101.yml'
  push:
    branches: ['whatsapp-only']
    paths:
      - 'src/neon/playable-heroes-core.js'
      - 'test/playable-seven-sins-20261027.test.mjs'
      - 'test/hero-hp-cura-pvp-20261031.test.mjs'
      - '.github/workflows/hero-level-balance-20261101.yml'

jobs:
  hero-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgres://unit:unit@127.0.0.1:5432/unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: PvP, Boss, Raid, HP, hero progression and hero ownership
        run: node --test test/playable-seven-sins-20261027.test.mjs test/hero-hp-cura-pvp-20261031.test.mjs
