name: AB-01 Web Raid hero initialization
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'test/web-raid-hero-start-tdz-20261110.test.mjs'
      - '.github/workflows/alpha-web-raid-hero-init-20261110.yml'
permissions:
  contents: read
jobs:
  verify-raid-open:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check test/web-raid-hero-start-tdz-20261110.test.mjs
      - name: Raid start, hero, damage and synergy regressions
        run: |
          node --test test/web-raid-hero-start-tdz-20261110.test.mjs
          node --test test/web-raid-hero-mastery-bridge-20261109.test.mjs
          node --test test/web-raid-vital-hp-20261110.test.mjs
          node --test test/web-vital-team-synergy-20261110.test.mjs
