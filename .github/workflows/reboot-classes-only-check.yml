name: Reboot Alpha — auditoria isolada sem banco
on:
  pull_request:
    paths:
      - 'docs/reboot-classes-only-20261117.md'
      - 'docs/reboot-data-inventory-20261117.md'
      - 'docs/reboot-isolated-db-runbook-20261117.md'
      - 'scripts/reboot-audit.mjs'
      - 'scripts/reboot-economy-baseline.mjs'
      - 'scripts/reboot-economy-sim.mjs'
      - 'scripts/reboot-reset-manifest.mjs'
      - 'src/neon/reboot-classes-policy.js'
      - 'src/neon/playable-heroes.js'
      - 'src/neon/games.js'
      - 'src/neon/db.js'
      - 'src/neon/index.js'
      - 'src/neon/game-catalog.js'
      - 'src/neon/web-event-center.js'
      - 'src/neon/web-api.js'
      - 'src/neon/relics.js'
      - 'src/neon/auction-bonus-20261101.js'
      - 'src/neon/npc-shops.js'
      - 'src/neon/auction-20261115-rewards.js'
      - 'test/reboot-audit.test.mjs'
      - 'test/reboot-economy-baseline.test.mjs'
      - 'test/reboot-economy-sim.test.mjs'
      - 'test/reboot-reset-manifest.test.mjs'
      - 'test/reboot-classes-policy.test.mjs'
      - 'test/reboot-web-collab.test.mjs'
      - '.github/workflows/reboot-classes-only-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check scripts/reboot-audit.mjs
          node --check scripts/reboot-economy-baseline.mjs
          node --check scripts/reboot-economy-sim.mjs
          node --check scripts/reboot-reset-manifest.mjs
          node --check src/neon/reboot-classes-policy.js
          node --check src/neon/playable-heroes.js
          node --check src/neon/games.js
          node --check src/neon/db.js
          node --check src/neon/index.js
          node --check src/neon/game-catalog.js
          node --check src/neon/web-event-center.js
          node --check src/neon/web-api.js
          node --check src/neon/relics.js
          node --check src/neon/auction-bonus-20261101.js
          node --check src/neon/npc-shops.js
          node --check src/neon/auction-20261115-rewards.js
      - name: Testes dedicados, sem dependencias ou credenciais
        run: node --test test/reboot-audit.test.mjs test/reboot-economy-baseline.test.mjs test/reboot-economy-sim.test.mjs test/reboot-reset-manifest.test.mjs test/reboot-classes-policy.test.mjs test/reboot-web-collab.test.mjs
      - name: Regressões do jogo anterior (sem DB)
        run: node --test test/regression-smoke.test.mjs test/playable-seven-sins-20261027.test.mjs
      - name: Auditorias somente leitura
        run: |
          node scripts/reboot-audit.mjs --json > /tmp/reboot-dependencies.json
          node scripts/reboot-economy-baseline.mjs --json > /tmp/reboot-business-baseline.json
          node scripts/reboot-economy-sim.mjs --json > /tmp/reboot-economy-sim.json
          node scripts/reboot-reset-manifest.mjs --json > /tmp/reboot-reset-manifest.json
          node -e "const d=require('/tmp/reboot-dependencies.json');const e=require('/tmp/reboot-business-baseline.json');const r=require('/tmp/reboot-reset-manifest.json');const sim=require('/tmp/reboot-economy-sim.json');if(!d.readOnly||!r.readOnly||!r.classes.valid||d.sourceFilesScanned<1||e.length<1||d.tablesFound.length!==r.total||!sim.readOnly||sim.profiles.length!==12||sim.profiles.some(p=>!p.current.accountingBalanced||!p.proposed.accountingBalanced))process.exit(1);console.log('Auditados',d.sourceFilesScanned,'arquivos,',d.tablesFound.length,'tabelas e',e.length,'cenarios de negocio');console.log('CLASSES:',r.classes.actual.join(', '));console.log('TABELAS POR CATEGORIA:',JSON.stringify(r.counts));console.log('TABELAS A REVISAR:',r.groups.unclassified_blocker.join(', '));"
