name: Group Flash Events - recovery isolation
on:
  pull_request:
    paths:
      - 'src/neon/index.js'
      - 'src/neon/group-flash-policy.js'
      - 'test/group-flash-policy.test.mjs'
      - '.github/workflows/group-flash-recovery.yml'
  push:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/group-flash-policy.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/index.js
          node --check src/neon/group-flash-policy.js
      - name: Safety and game mechanics
        run: node --test test/group-flash-policy.test.mjs
