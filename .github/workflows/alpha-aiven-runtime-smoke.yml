# Teste temporario, apenas leitura. Executa API isolada sem WhatsApp.
# Nao usa o Neon, nem atualiza Render/Vercel.
name: "Alpha Bot | Testar API no Aiven (somente leitura)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-aiven-readonly-smoke
  cancel-in-progress: false

jobs:
  verify-aiven:
    name: "Testar Node, banco Aiven e rotas Web"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "Baixar codigo API-only fixado, sem iniciar WhatsApp"
        uses: actions/checkout@v4
        with:
          ref: fb31618f7a7a374fb6b167c34416c68ba8b70c24
          persist-credentials: false
      - name: "Node 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: "Instalar dependencias de teste sem modificar lockfile"
        # O lockfile legado esta dessincronizado com o package.json, entao npm ci falharia.
        # Isto modifica somente o executor temporario do CI, nunca as branches do bot.
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: "Preparar certificado de confianca do Aiven"
        env:
          AIVEN_CA_PEM: ${{ secrets.ALPHA_AIVEN_CA }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${AIVEN_CA_PEM:-}" || "$AIVEN_CA_PEM" != *"-----BEGIN CERTIFICATE-----"* || "$AIVEN_CA_PEM" != *"-----END CERTIFICATE-----"* ]]; then
            echo "::error::Falta o GitHub Actions Repository Secret ALPHA_AIVEN_CA com o certificado CA publico do Aiven."
            exit 1
          fi
          umask 077
          printf '%s\n' "$AIVEN_CA_PEM" > "$RUNNER_TEMP/alpha-aiven-ca.pem"
          openssl x509 -in "$RUNNER_TEMP/alpha-aiven-ca.pem" -noout >/dev/null
          echo 'CA publica do Aiven carregada e formato PEM validado.'
      - name: "Confirmar conexao Aiven e modo somente-leitura"
        env:
          DATABASE_URL: ${{ secrets.ALPHA_AIVEN_URI }}
          PGOPTIONS: "-c default_transaction_read_only=on"
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/alpha-aiven-ca.pem
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg'
          const conn = process.env.DATABASE_URL
          if (!conn) throw new Error('Repository secret ALPHA_AIVEN_URI nao configurado')
          let u
          try {u = new URL(conn)} catch {throw new Error('URI de destino invalida')}
          if (u.hostname !== 'alphabot-lcsh-3393.b.aivencloud.com' || u.port !== '26343' || u.pathname !== '/defaultdb') {
            throw new Error('Banco de destino nao e o Aiven alphabot/defaultdb. Abortado.')
          }
          const client = new pg.Client({connectionString: conn, connectionTimeoutMillis: 12000})
          try {
            await client.connect()
            const mode = await client.query("SELECT current_database() AS db, current_setting('default_transaction_read_only') AS ro")
            if(mode.rows[0]?.db !== 'defaultdb' || mode.rows[0]?.ro !== 'on') {
              throw new Error('Protecao read-only nao ativa. Abortado.')
            }
            const found = await client.query("SELECT (SELECT count(*)::int FROM pg_tables WHERE schemaname='public') AS tables, (SELECT count(*)::int FROM users) AS players, (SELECT count(*)::int FROM inventories) AS inventories, (SELECT count(*)::int FROM wallets) AS wallets")
            if (found.rows[0]?.tables !== 67 || found.rows[0]?.players !== 5 || found.rows[0]?.wallets !== 5) {
              throw new Error('Schema/dados divergentes da copia validada. Abortado.')
            }
            console.log('Aiven confirmado: read-only ON; 67 tabelas; 5 jogadores; 5 carteiras.')
          } finally {
            await client.end().catch(()=>{})
          }
          NODE
      - name: "Testar conector Node pg e API isolada local"
        env:
          DATABASE_URL: ${{ secrets.ALPHA_AIVEN_URI }}
          PGOPTIONS: "-c default_transaction_read_only=on"
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/alpha-aiven-ca.pem
          ALPHA_RUNTIME: web-api-only
          WEB_ALLOWED_ORIGINS: "https://alpha-web-rpg.vercel.app"
          PORT: "18437"
          NODE_ENV: test
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {db} from './src/neon/db.js'
          try{
            const q=await db.query("SELECT current_database() AS db, current_setting('default_transaction_read_only') AS ro, (SELECT count(*)::int FROM items) AS items")
            if(q.rows[0]?.db!=='defaultdb' || q.rows[0]?.ro!=='on' || q.rows[0]?.items<10){
              throw new Error('Adaptador do jogo nao confirmou Aiven read-only.')
            }
            console.log('Conector PostgreSQL do Alpha Bot: OK, somente leitura.')
          }finally{await db.end()}
          NODE
          node src/neon/render.js > "$RUNNER_TEMP/alpha-aiven-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 "http://127.0.0.1:$PORT/health" -o "$RUNNER_TEMP/alpha-health.json"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::API-only encerrou antes de responder (logs omitidos para nao expor credenciais)."
              exit 1
            fi
            sleep 1
          done
          curl -fsS --max-time 5 "http://127.0.0.1:$PORT/api/v1/health" -o "$RUNNER_TEMP/alpha-route-health.json"
          curl -fsS --max-time 20 "http://127.0.0.1:$PORT/api/v1/catalog" -o "$RUNNER_TEMP/alpha-catalog.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const read=p=>JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+p,'utf8'))
          const h=read('alpha-health.json'), api=read('alpha-route-health.json'), catalog=read('alpha-catalog.json')
          if(h.ok!==true || h.runtime!=='web-api-only') throw new Error('Servidor iniciou no modo errado.')
          if(api.ok!==true || api.service!=='alpha-web-api') throw new Error('Rota API health invalida.')
          if(catalog.ok!==true || !Array.isArray(catalog.data?.allItems) || catalog.data.allItems.length<10) throw new Error('Catalogo nao retornou itens do banco.')
          console.log('HTTP /health OK: web-api-only; /api/v1/health OK; /api/v1/catalog OK ('+catalog.data.allItems.length+' itens).')
          NODE
          echo 'Teste concluido sem parear WhatsApp nem alterar dados dos jogadores.'
