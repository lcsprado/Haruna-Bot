name: AB-01 Boss Raid potions and hero pet parity
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'src/neon/player-potions.js'
      - 'test/web-boss-raid-potion-hero-pet-20261110.test.mjs'
      - '.github/workflows/ab01-boss-raid-potion-pet-20261110.yml'
permissions:
  contents: read
jobs:
  potion-pet:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check src/neon/player-potions.js
          node --check test/web-boss-raid-potion-hero-pet-20261110.test.mjs
      - name: Boss Raid potion and hero pet regression
        run: |
          node --test test/web-boss-raid-potion-hero-pet-20261110.test.mjs
          node --test test/web-boss-hero-parity-20261109.test.mjs
          node --test test/web-raid-hero-start-tdz-20261110.test.mjs
          node --test test/web-raid-vital-hp-20261110.test.mjs
          node --test test/web-vital-team-synergy-20261110.test.mjs
