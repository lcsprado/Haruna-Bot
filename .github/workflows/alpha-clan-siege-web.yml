name: Alpha Web - Cerco UI
on:
  pull_request:
    branches:
      - release/alpha-web-ban-art-api-20261029
    paths:
      - 'web/app.js'
      - 'web/clan-siege-ui.js'
      - 'test/web-siege-fronts-v4-20261103.test.mjs'
      - 'test/web-clan-fortress-20261103.test.mjs'
      - 'test/web-siege-fronts-v4-20261103.test.mjs'
      - 'web/styles.css'
      - 'web/index.html'
      - 'web/sw.js'
      - 'web/racing-ui.js'
      - 'web/assets/**'
      - 'test/web-modern-cerco-integration-20261102.test.mjs'
      - 'test/web-clan-siege-preview-20261102.test.mjs'
      - '.github/workflows/alpha-clan-siege-web.yml'
  push:
    branches:
      - feat/web-cerco-clas-preview-20261102
      - release/alpha-web-ban-art-api-20261029
    paths:
      - 'web/clan-siege-ui.js'
      - 'web/index.html'
      - 'web/sw.js'
      - 'test/web-siege-daily-20h-20261103.test.mjs'
      - 'test/web-siege-fronts-v4-20261103.test.mjs'
      - '.github/workflows/alpha-clan-siege-web.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check web/app.js
          node --check web/clan-siege-ui.js
          node --check web/racing-ui.js
      - name: Web siege preview and live-state tests
        run: node --test test/web-clan-siege-preview-20261102.test.mjs test/web-modern-cerco-integration-20261102.test.mjs test/web-siege-daily-20h-20261103.test.mjs test/web-siege-strategy-preview-fix-20261103.test.mjs test/web-siege-team-tactics-20261103.test.mjs test/web-clan-fortress-20261103.test.mjs test/web-siege-fronts-v4-20261103.test.mjs
