name: Guerra das Almas secret restart 2min
on:
  push:
    branches: [fix/guerra-almas-secret-moves-20261030]
  pull_request:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/guerra-almas-v2.js'
      - 'src/neon/guerra-almas-secret.js'
      - 'src/neon/guerra-almas-rules.js'
      - 'src/neon/index.js'
      - 'test/guerra-almas-secret-restart-20261030.test.mjs'
      - '.github/workflows/guerra-almas-secret-restart-20261030.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax
        run: |
          node --check src/neon/guerra-almas-v2.js
          node --check src/neon/guerra-almas-secret.js
          node --check src/neon/guerra-almas-rules.js
          node --check src/neon/index.js
      - name: Test secret war and previous historical rules
        run: |
          node --test test/guerra-almas-secret-restart-20261030.test.mjs
          node --test test/guerra-almas-halloween-20261030.test.mjs
