name: Pet adoption category validation

on:
  push:
    branches: [feat/pet-adoption-by-category-20261012]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax of WhatsApp and category menu
        run: |
          npm run check
          node --check src/neon/index.js
          node --check src/neon/pet-adoption-menu.js
      - name: Category menu and interaction tests
        run: node --test test/pet-adoption-category.test.mjs
      - name: Compare full tests to production baseline
        run: |
          git fetch --no-tags --depth=1 origin whatsapp-only:refs/remotes/origin/whatsapp-only
          git worktree add --detach "$RUNNER_TEMP/adoption-baseline" origin/whatsapp-only
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/adoption-baseline/node_modules"
          PVP_BASELINE_DIR="$RUNNER_TEMP/adoption-baseline" node scripts/check-pvp-regression-baseline.mjs
