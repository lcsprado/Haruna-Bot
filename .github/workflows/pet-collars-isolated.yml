name: Pet collars isolated validation
on:
  push:
    branches:
      - feature/pet-collars-v2-20261128
  pull_request:
    branches:
      - whatsapp-only
    paths:
      - 'src/neon/pet-collars.js'
      - 'src/neon/pet-collar-menu.js'
      - 'web/app.js'
      - 'test/pet-collars-v2*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collar_test
          POSTGRES_PASSWORD: collar_test_local
          POSTGRES_DB: alpha_reboot_collars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collar_test -d alpha_reboot_collars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/pet-collars-v2.test.mjs test/pet-collars-v2-menu.test.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run check
      - run: node --check web/app.js && node --check web/sw.js && node --check src/neon/pet-collar-menu.js
      - run: node --test test/regression-smoke.test.mjs test/pet-collection-menu.test.mjs test/pvp-full-report-20261014.test.mjs test/pet-collars-v2-postgres.test.mjs
        env:
          ALPHA_COLLAR_TEST_DB: postgresql://collar_test:collar_test_local@127.0.0.1:5432/alpha_reboot_collars_test
