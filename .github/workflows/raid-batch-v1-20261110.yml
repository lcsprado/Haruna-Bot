name: RaidLote V1 gated - economic and real PostgreSQL safety
on:
  pull_request:
    paths:
      - 'src/neon/raid-batch*.js'
      - 'src/neon/games.js'
      - 'src/neon/index.js'
      - 'test/raid-batch-v1-*.test.mjs'
      - '.github/workflows/raid-batch-v1-20261110.yml'
permissions:
  contents: read
jobs:
  rules-and-raid-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check core JS syntax before importing any production code
        run: |
          node --check src/neon/raid-batch.js
          node --check src/neon/raid-batch-rules.js
          node --check src/neon/raid-batch-ledger.js
          node --check src/neon/games.js
          node --check src/neon/index.js
          node --check test/raid-batch-v1-rules-20261110.test.mjs
          node --check test/raid-batch-v1-postgres-20261110.test.mjs
      - name: Exact cost, combat and queue checks
        run: |
          node --test test/raid-batch-v1-rules-20261110.test.mjs
          node --test test/raid-final-notice-confirmation-20261110.test.mjs
          node --test test/collab-raid-20261024-shard-economy.test.mjs
          node --test test/raid-hero-powers-activation-20261102.test.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_raidlote
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_raidlote"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_raidlote
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL driver
        run: npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund
      - name: Check runtime module imports and database wiring
        run: node --input-type=module -e "await import('./src/neon/raid-batch.js'); await import('./src/neon/games.js'); await import('./src/neon/raid-batch-ledger.js'); console.log('All runtime imports resolved')"
      - name: Database schema, eligibility, fees, victory, loss and crash-safety
        run: |
          node --test test/raid-batch-v1-postgres-20261110.test.mjs
          node --test test/raid-batch-v1-schema-20261110.test.mjs
