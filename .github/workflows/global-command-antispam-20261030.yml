name: Alpha Bot - antispam geral comandos
on:
  push:
    branches:
      - fix/global-command-antispam-20261030
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do ingresso e limitador
        run: |
          node --check src/neon/command-antispam.js
          node --check src/neon/index.js
      - name: Rodar testes isolados sem segredos nem banco
        run: node --test test/global-command-antispam-20261030.test.mjs
      - name: Validar integracao no pipeline do WhatsApp
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const src=fs.readFileSync('src/neon/index.js','utf8')
          assert.ok(src.includes("import {createGlobalCommandAntispam,commandAntispamNotice} from './command-antispam.js'"))
          const start=src.indexOf('const body=textOf(msg).trim()')
          const guard=src.indexOf('globalCommandAntispam.inspect(', start)
          const ensure=src.indexOf('await ensureUser(sender', start)
          assert.ok(start>=0 && guard>start && ensure>guard,'antispam precisa filtrar antes da base')
          console.log('Antispam global integrado antes da primeira carga de usuario.')
          EOF
