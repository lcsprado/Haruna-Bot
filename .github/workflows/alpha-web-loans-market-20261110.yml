name: AB-05 AB-06 Web loans and marketplace safeguards
on:
  pull_request:
    paths:
      - 'src/neon/loans.js'
      - 'src/neon/db.js'
      - 'test/web-loans-market-shield-20261110.test.mjs'
      - '.github/workflows/alpha-web-loans-market-20261110.yml'
permissions:
  contents: read
jobs:
  economy-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/loans.js
          node --check src/neon/db.js
          node --check test/web-loans-market-shield-20261110.test.mjs
      - name: Economic consistency regressions
        run: |
          node --test test/web-loans-market-shield-20261110.test.mjs
          node --test test/loan-auto-insolvency-no-negative-20261109.test.mjs
          node --test test/market-bidirectional-locks-20261109.test.mjs
