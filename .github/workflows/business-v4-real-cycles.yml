name: Alpha Business V4 - lucro minimo e ciclos reais
on:
  pull_request:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/business-rebalance-v4.js'
      - 'src/neon/reboot-economy-policy.js'
      - 'src/neon/progression.js'
      - 'src/neon/index.js'
      - 'test/business-rebalance-v4-20261123.test.mjs'
      - 'docs/business-v4-real-cycles-20261123.md'
      - '.github/workflows/business-v4-real-cycles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business-v4-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe sem banco
        run: |
          node --check src/neon/business-rebalance-v4.js
          node --check src/neon/reboot-economy-policy.js
          node --check src/neon/progression.js
          node --check src/neon/index.js
          node --check test/business-rebalance-v4-20261123.test.mjs
      - name: Validar V1 V2 V3 V4 e cortes históricos sem credenciais
        env:
          ALPHA_BUSINESS_REBALANCE_V4: 'off'
        run: |
          node --test test/business-rebalance-v4-20261123.test.mjs test/business-rebalance-v3-20261123.test.mjs test/reboot-economy-policy.test.mjs test/business-multilevel-20261013.test.mjs
