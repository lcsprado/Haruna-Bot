name: Leilao Alpha 15 Nov - three real lots
on:
  pull_request:
    paths:
      - 'src/neon/auction-20261115-*.js'
      - 'src/neon/auction-bonus-20261101-1500.js'
      - 'src/neon/raid-lote-store.js'
      - 'src/neon/index.js'
      - 'test/auction-20261115.test.mjs'
      - '.github/workflows/auction-20261115.yml'
  push:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/auction-20261115-*.js'
      - 'test/auction-20261115.test.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/auction-20261115-2100.js
          node --check src/neon/auction-20261115-rewards.js
          node --check src/neon/raid-lote-store.js
          node --check src/neon/index.js
      - name: Auction transactional safety and older regression
        run: node --test test/auction-20261115.test.mjs test/raid-lote-daily-limit-20261112.test.mjs test/auction-forged-rewards-20261111.test.mjs
