name: Raid final confirmation timeout regression
on:
  pull_request:
    paths:
      - 'src/neon/index.js'
      - 'test/raid-final-notice-confirmation-20261110.test.mjs'
      - '.github/workflows/raid-final-notice-20261110.yml'
permissions:
  contents: read
jobs:
  raid-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/index.js
          node --check test/raid-final-notice-confirmation-20261110.test.mjs
      - name: Confirmed delivery and no-duplicate policy
        run: |
          node --test test/raid-final-notice-confirmation-20261110.test.mjs
          node --test test/boss-final-outbox-20261107.test.mjs
