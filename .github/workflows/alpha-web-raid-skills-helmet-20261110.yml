name: AB-01 PvE Raid Skill and Halloween helmet parity
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'src/neon/halloween-rules.js'
      - 'src/neon/raid-skill-summary.js'
      - 'test/web-raid-skill-helmet-parity-20261110.test.mjs'
      - '.github/workflows/alpha-web-raid-skills-helmet-20261110.yml'
permissions:
  contents: read
jobs:
  pve-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check src/neon/halloween-rules.js
          node --check src/neon/raid-skill-summary.js
          node --check test/web-raid-skill-helmet-parity-20261110.test.mjs
      - name: PvE parity regression tests
        run: |
          node --test test/web-raid-skill-helmet-parity-20261110.test.mjs
          node --test test/web-combat-parity-20261110.test.mjs
          node --test test/web-pet-autoheal-parity-20261110.test.mjs
          node --test test/web-raid-hero-mastery-bridge-20261109.test.mjs
