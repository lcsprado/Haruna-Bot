name: Pet sacrifice refund validation

on:
  push:
    branches: [fix/pet-sacrifice-half-price-20261012]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax and economy checks
        run: |
          npm run check
          node --check src/neon/db.js
          node --check src/neon/index.js
          node --test test/pet-sacrifice-refund.test.mjs
      - name: Regression comparison with production
        run: |
          git fetch --no-tags --depth=1 origin whatsapp-only:refs/remotes/origin/whatsapp-only
          git worktree add --detach "$RUNNER_TEMP/sacrifice-baseline" origin/whatsapp-only
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/sacrifice-baseline/node_modules"
          PVP_BASELINE_DIR="$RUNNER_TEMP/sacrifice-baseline" node scripts/check-pvp-regression-baseline.mjs
