name: Alpha Web Boss - safe settled receipt
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'src/neon/boss-final-results.js'
      - 'test/web-boss-settlement-snapshot.test.mjs'
      - '.github/workflows/web-boss-final-snapshot.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check src/neon/boss-final-results.js
      - name: Synthetic Boss reward receipt
        run: node --test test/web-boss-settlement-snapshot.test.mjs
