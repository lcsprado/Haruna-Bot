name: Alpha Web - bloqueio de sessoes legadas sem senha
on:
  pull_request:
    branches: [feat/web-aiven-beta-protegido-20261021]
    paths:
      - 'src/neon/web-api.js'
      - 'test/web-auth-throttle-20261109.test.mjs'
      - '.github/workflows/alpha-web-password-session-guard.yml'
  push:
    branches: [feat/web-aiven-beta-protegido-20261021]
    paths:
      - 'src/neon/web-api.js'
      - 'test/web-auth-throttle-20261109.test.mjs'
permissions:
  contents: read
jobs:
  legacy-sessions-blocked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check syntax of isolated Cerco API
        run: node --check src/neon/web-api.js
      - name: Validate code-only login locked and throttles intact
        run: node --test test/web-auth-throttle-20261109.test.mjs
