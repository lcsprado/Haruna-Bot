name: Alpha Bot - Raid Bleach named collab (isolated, no deploy)
on:
  push:
    branches: [feat/raid-bleach-named-collab-20261116]
    paths:
      - 'src/neon/named-collab-raids.js'
      - 'src/neon/games.js'
      - 'src/neon/db.js'
      - 'src/neon/index.js'
      - 'test/raid-bleach-named-collab-20261116.test.mjs'
      - '.github/workflows/raid-bleach-named-20261116.yml'
  pull_request:
    paths:
      - 'src/neon/named-collab-raids.js'
      - 'src/neon/games.js'
      - 'src/neon/db.js'
      - 'src/neon/index.js'
      - 'test/raid-bleach-named-collab-20261116.test.mjs'
      - '.github/workflows/raid-bleach-named-20261116.yml'
permissions:
  contents: read
jobs:
  raid-bleach:
    name: Named Bleach / 75 safety and legacy Raid regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/neon/named-collab-raids.js
      - run: node --check src/neon/games.js
      - run: node --check src/neon/db.js
      - run: node --check src/neon/index.js
      - run: node --test test/raid-bleach-named-collab-20261116.test.mjs test/collab-raid-20261024-shard-economy.test.mjs test/raid-go-host-clarity-20261111.test.mjs test/raid-lobby-diagnostics-20261111.test.mjs test/raid-late-join-hp-20261017.test.mjs test/raid-lote-policy.test.js test/raid-lote-real-combat.test.js
