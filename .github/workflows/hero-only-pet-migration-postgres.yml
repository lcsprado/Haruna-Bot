name: Hero-only migration PostgreSQL integration

on:
  push:
    branches: ['web-integration-playable-seven-sins-20261027']
    paths:
      - 'src/neon/hero-only-pet-*.js'
      - 'src/neon/playable-heroes.js'
      - 'test/hero-only-pet-migration.integration.test.mjs'
      - '.github/workflows/hero-only-pet-migration-postgres.yml'
  pull_request:
    paths:
      - 'src/neon/hero-only-pet-*.js'
      - 'src/neon/playable-heroes.js'
      - 'test/hero-only-pet-migration.integration.test.mjs'
      - '.github/workflows/hero-only-pet-migration-postgres.yml'

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      HERO_MIGRATION_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL migration / ownership preservation / rerun
        run: node --test test/hero-only-pet-migration.integration.test.mjs
