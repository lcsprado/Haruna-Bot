name: AB-01 Raid owner reward parity read only
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'src/neon/owner-event-readonly.js'
      - 'test/web-raid-owner-event-parity-20261110.test.mjs'
      - '.github/workflows/ab01-raid-owner-event-20261110.yml'
permissions:
  contents: read
jobs:
  owner-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check src/neon/owner-event-readonly.js
          node --check test/web-raid-owner-event-parity-20261110.test.mjs
      - name: Owner Raid rewards regression
        run: |
          node --test test/web-raid-owner-event-parity-20261110.test.mjs
          node --test test/web-boss-raid-potion-hero-pet-20261110.test.mjs
          node --test test/web-combat-parity-20261110.test.mjs
