name: Alpha Bot - atalhos WhatsApp

on:
  push:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/index.js'
      - 'test/command-shortcuts-20261110.test.mjs'
      - '.github/workflows/shortcuts-validation.yml'
  pull_request:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/index.js'
      - 'test/command-shortcuts-20261110.test.mjs'
      - '.github/workflows/shortcuts-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shortcuts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do WhatsApp
        run: node --check src/neon/index.js
      - name: Validar atalhos sem banco nem compras
        run: node --test test/command-shortcuts-20261110.test.mjs
      - name: Garantir que testes não usam banco real
        run: test -z "$DATABASE_URL"
