name: Alpha Bot | Primeiro Nv 500 (somente perfil)
on:
  pull_request:
    paths:
      - 'src/neon/first-level-500-title.js'
      - 'src/neon/db.js'
      - 'src/neon/index.js'
      - 'test/first-level-500-title-20261107.test.mjs'
      - '.github/workflows/first-level-500-title.yml'
  workflow_dispatch:
jobs:
  validar-marco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --check src/neon/first-level-500-title.js
          node --check src/neon/db.js
          node --check src/neon/index.js
          node --check test/first-level-500-title-20261107.test.mjs
      - name: Testar exclusividade, concorrencia, migração e !perfil
        run: node --test test/first-level-500-title-20261107.test.mjs
