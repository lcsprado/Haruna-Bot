name: Venda de itens forjados - seguranca de equipados
on:
  push:
    branches:
      - fix/sell-unequipped-forged-20261113-whatsapp
      - fix/sell-unequipped-forged-20261113-web
  pull_request:
    branches:
      - whatsapp-only
      - feat/web-aiven-beta-protegido-20261021
  workflow_dispatch:
jobs:
  targeted-sale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax of sale backends
        run: |
          node --check src/neon/db.js
          node --check src/neon/index.js
          node --check src/neon/paid-gear-resale.js
          node --check web/app.js
      - name: Targeted sale scenarios (no database connection)
        run: |
          node --test test/paid-gear-resale-20261126.test.mjs test/star-forge-level-20261021.test.mjs test/shield-forge-integration-20261108.test.mjs test/stone-upgrade-policy.test.mjs
          node --test --test-name-pattern='Inventário exibe atributos reais' test/web-rich-ui-preservation.test.mjs
          if [ -f test/unequipped-forged-sales-20261113.test.mjs ]; then
            node --test test/unequipped-forged-sales-20261113.test.mjs
          fi
          if [ -f test/web-equipped-shield-sale-20261113.test.mjs ]; then
            node --test test/web-equipped-shield-sale-20261113.test.mjs
          fi
