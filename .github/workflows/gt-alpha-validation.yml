name: GT Alpha Bot - campeonato automatico
on:
  pull_request:
    paths:
      - 'src/neon/gt-alpha-*.js'
      - 'src/neon/index.js'
      - 'test/gt-alpha.test.mjs'
      - 'test/gt-alpha-weather-sponsor.test.mjs'
      - 'test/gt-alpha-sponsor-numeric.test.mjs'
      - 'src/neon/racing-alpha.js'
      - 'src/neon/racing-commands.js'
      - '.github/workflows/gt-alpha-validation.yml'
  push:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/gt-alpha-*.js'
      - 'test/gt-alpha.test.mjs'
      - 'test/gt-alpha-weather-sponsor.test.mjs'
      - 'test/gt-alpha-sponsor-numeric.test.mjs'
      - 'src/neon/racing-alpha.js'
      - 'src/neon/racing-commands.js'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/neon/gt-alpha-rules.js
          node --check src/neon/gt-alpha-event.js
          node --check src/neon/gt-alpha-sponsors.js
          node --check src/neon/gt-alpha-sponsor-rules.js
          node --check src/neon/racing-alpha.js
          node --check src/neon/racing-commands.js
          node --check src/neon/index.js
      - name: Racing physics, payouts and safety
        run: node --test test/gt-alpha.test.mjs test/gt-alpha-weather-sponsor.test.mjs test/gt-alpha-sponsor-numeric.test.mjs test/racing-alpha.test.mjs
