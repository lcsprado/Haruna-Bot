name: AB-04 Live Business Collection Reconciliation
on:
  pull_request:
    paths:
      - 'src/neon/business-profit.js'
      - 'src/neon/progression.js'
      - 'test/business-income-rebalance-20261110.test.mjs'
      - '.github/workflows/ab04-profit-live-reconciliation-20261110.yml'
permissions:
  contents: read
jobs:
  collection-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/business-profit.js
          node --check test/business-income-rebalance-20261110.test.mjs
      - name: Live anonymized reconciliation and future 24h caps
        run: node --test test/business-income-rebalance-20261110.test.mjs
