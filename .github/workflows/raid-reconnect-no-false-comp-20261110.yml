name: Critical Raid reconnect - no false compensation
on:
  pull_request:
    paths:
      - 'src/neon/index.js'
      - 'test/raid-reconnect-no-false-compensation-20261104.test.mjs'
      - '.github/workflows/raid-reconnect-no-false-comp-20261110.yml'
permissions:
  contents: read
jobs:
  reconnect-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/index.js
          node --check test/raid-reconnect-no-false-compensation-20261104.test.mjs
      - name: Prevent unfounded compensation and safe final notices
        run: |
          node --test test/raid-reconnect-no-false-compensation-20261104.test.mjs
          node --test test/raid-final-notice-confirmation-20261110.test.mjs
