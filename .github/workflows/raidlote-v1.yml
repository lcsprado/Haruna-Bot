name: Raid Lote V1 - safety and PostgreSQL
on:
  pull_request:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/raid-lote-*.js'
      - 'src/neon/games.js'
      - 'src/neon/index.js'
      - 'test/raid-lote-*.test.js'
      - '.github/workflows/raidlote-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes isolados das regras e do worker
        run: node --test test/raid-lote-policy.test.js test/raid-lote-store.test.js test/raid-lote-combat-adapter.test.js test/raid-lote-worker.test.js test/raid-lote-public.test.js
      - name: Sintaxe do bot e motor de Raid
        run: |
          node --check src/neon/index.js
          node --check src/neon/games.js
          node --check src/neon/raid-lote-store.js
          node --check src/neon/raid-lote-combat-adapter.js
          node --check src/neon/raid-lote-worker.js
          node --check src/neon/raid-lote-public.js
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_ci
          POSTGRES_PASSWORD: raid_lote_ci_only
          POSTGRES_DB: alpha_raid_lote_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_ci -d alpha_raid_lote_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAID_LOTE_TEST_DATABASE_URL: postgresql://alpha_ci:raid_lote_ci_only@localhost:5432/alpha_raid_lote_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar somente pg isolado do lockfile do bot
        run: |
          mkdir -p "$RUNNER_TEMP/raidlote-pg"
          npm install --prefix "$RUNNER_TEMP/raidlote-pg" --no-save --no-package-lock --ignore-scripts pg@8.13.0
          ln -s "$RUNNER_TEMP/raidlote-pg/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Teste de compra antecipada, idempotencia e sem reembolso em PostgreSQL descartavel
        run: node --test test/raid-lote-postgres-integration.test.js

  real-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_ci
          POSTGRES_PASSWORD: raid_lote_real_ci_only
          POSTGRES_DB: alpha_raid_lote_real_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_ci -d alpha_raid_lote_real_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAID_LOTE_TEST_DATABASE_URL: postgresql://alpha_ci:raid_lote_real_ci_only@localhost:5432/alpha_raid_lote_real_ci
      DATABASE_URL: postgresql://alpha_ci:raid_lote_real_ci_only@localhost:5432/alpha_raid_lote_real_ci
      RAID_LOTE_V1_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencia pg sem tocar nas dependencias gerais do bot
        run: |
          mkdir -p "$RUNNER_TEMP/raidlote-real-pg"
          npm install --prefix "$RUNNER_TEMP/raidlote-real-pg" --no-save --no-package-lock --ignore-scripts pg@8.13.0
          ln -s "$RUNNER_TEMP/raidlote-real-pg/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Motor real startRaid/raidRound - pacote e liquidacao
        run: node --test test/raid-lote-real-combat.test.js
