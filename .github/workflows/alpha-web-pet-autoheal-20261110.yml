name: AB-01 Web pet potion parity
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'src/neon/boss-pet-autocure.js'
      - 'src/neon/pet-potion-auto-policy.js'
      - 'test/web-pet-autoheal-parity-20261110.test.mjs'
      - '.github/workflows/alpha-web-pet-autoheal-20261110.yml'
permissions:
  contents: read
jobs:
  pet-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check src/neon/boss-pet-autocure.js
          node --check src/neon/pet-potion-auto-policy.js
          node --check test/web-pet-autoheal-parity-20261110.test.mjs
      - name: No dependencies - pet potion transaction and Web round checks
        run: node --test test/web-pet-autoheal-parity-20261110.test.mjs
      - name: Existing web combat regressions
        run: |
          node --test test/web-combat-parity-20261110.test.mjs
          node --test test/web-pve-critical-resistance-20261109.test.mjs
