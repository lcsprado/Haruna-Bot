name: Alpha V2 - PostgreSQL descartavel
on:
  pull_request:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/**'
      - 'test/reboot-postgres-real-combat.integration.test.mjs'
      - '.github/workflows/reboot-postgres-real-ci.yml'
      - 'STATUS_V2.md'
permissions:
  contents: read
jobs:
  v2-real-raid:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/reboot-classes-only-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: alpha_ci
          POSTGRES_PASSWORD: v2_disposable_ci_only
          POSTGRES_DB: alpha_reboot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_ci -d alpha_reboot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHA_V2_TEST_DATABASE_URL: postgresql://alpha_ci:v2_disposable_ci_only@127.0.0.1:5432/alpha_reboot_ci
      DATABASE_URL: postgresql://alpha_ci:v2_disposable_ci_only@127.0.0.1:5432/alpha_reboot_ci
      ALPHA_REBOOT_MODE: classes_only
      ALPHA_REBOOT_DB_CONFIRMED: isolated-v2
      RAID_LOTE_V1_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar somente driver pg
        run: |
          mkdir -p "$RUNNER_TEMP/alpha-v2-pg"
          npm install --prefix "$RUNNER_TEMP/alpha-v2-pg" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.13.0
          ln -s "$RUNNER_TEMP/alpha-v2-pg/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Teste real sem WhatsApp, Web ou servicos externos
        run: node --test test/reboot-postgres-real-combat.integration.test.mjs
      - name: Validar dump e restore SINTETICOS no PostgreSQL descartavel
        env:
          LOCAL_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$LOCAL_PG_CONTAINER"
          DUMP="$RUNNER_TEMP/alpha-reboot-synthetic.dump"
          docker exec "$LOCAL_PG_CONTAINER" pg_dump -U alpha_ci -d alpha_reboot_ci -Fc --no-owner --no-acl > "$DUMP"
          test -s "$DUMP"
          sha256sum "$DUMP" > "$DUMP.sha256"
          sha256sum -c "$DUMP.sha256"
          docker exec -i "$LOCAL_PG_CONTAINER" pg_restore --list < "$DUMP" > "$DUMP.toc"
          test -s "$DUMP.toc"
          docker exec "$LOCAL_PG_CONTAINER" createdb -U alpha_ci alpha_reboot_restore_ci
          docker exec -i "$LOCAL_PG_CONTAINER" pg_restore --exit-on-error --no-owner --no-acl -U alpha_ci -d alpha_reboot_restore_ci < "$DUMP"
          Q="SELECT (SELECT count(*) FROM users),(SELECT count(*) FROM wallets),(SELECT coalesce(sum(cash+bank),0) FROM wallets),(SELECT count(*) FROM inventories),(SELECT coalesce(sum(quantity),0) FROM inventories),(SELECT count(*) FROM transactions),(SELECT count(*) FROM trevo_games),(SELECT count(*) FROM pet_collection),(SELECT count(*) FROM information_schema.tables WHERE table_schema='public');"
          docker exec "$LOCAL_PG_CONTAINER" psql -XAt -v ON_ERROR_STOP=1 -U alpha_ci -d alpha_reboot_ci -c "$Q" > "$RUNNER_TEMP/alpha-original.counts"
          docker exec "$LOCAL_PG_CONTAINER" psql -XAt -v ON_ERROR_STOP=1 -U alpha_ci -d alpha_reboot_restore_ci -c "$Q" > "$RUNNER_TEMP/alpha-restored.counts"
          diff -u "$RUNNER_TEMP/alpha-original.counts" "$RUNNER_TEMP/alpha-restored.counts"
          echo 'ALPHA_V2_SYNTHETIC_RESTORE_OK'
          rm -f "$DUMP" "$DUMP.sha256" "$DUMP.toc" "$RUNNER_TEMP/alpha-original.counts" "$RUNNER_TEMP/alpha-restored.counts"
