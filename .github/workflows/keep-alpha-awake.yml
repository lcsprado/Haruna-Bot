name: Keep Alpha Bot Awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Ping Alpha Bot health endpoint
        run: |
          echo "Pinging Alpha Bot..."
          curl --silent --show-error --max-time 60 \
            -o /dev/null \
            -w "HTTP %{http_code}\n" \
            https://alpha-bot-whatsapp-m3lc.onrender.com/health || true
