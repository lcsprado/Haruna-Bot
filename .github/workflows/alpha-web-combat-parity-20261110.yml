name: AB-01 Web combat parity and per-hero damage
on:
  pull_request:
    paths:
      - 'src/neon/games.js'
      - 'src/neon/damage-hero-stats.js'
      - 'test/web-combat-parity-20261110.test.mjs'
      - '.github/workflows/alpha-web-combat-parity-20261110.yml'
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/neon/games.js
          node --check src/neon/damage-hero-stats.js
          node --check test/web-combat-parity-20261110.test.mjs
      - name: Install dev dependencies in ephemeral runner
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund
      - name: Regressions AB-01 + PvP + Raid + Boss
        run: |
          node --test test/web-combat-parity-20261110.test.mjs
          node --test test/web-pve-critical-resistance-20261109.test.mjs
          node --test test/pvp-web-real-battle-parity-20261109.test.mjs
          node --test test/web-boss-hero-parity-20261109.test.mjs
          node --test test/web-raid-hero-mastery-bridge-20261109.test.mjs
