name: Alpha Web password login - auth and isolation
on:
  pull_request:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/web-password-auth.js'
      - 'src/neon/web-password-accounts.js'
      - 'src/neon/web-api.js'
      - 'src/neon/render-whatsapp.js'
      - 'web/**'
      - 'test/web-password-*.test.mjs'
      - '.github/workflows/alpha-web-password-auth.yml'
  push:
    branches: [whatsapp-only]
    paths:
      - 'src/neon/web-password-auth.js'
      - 'src/neon/web-password-accounts.js'
      - 'src/neon/web-api.js'
      - 'src/neon/render-whatsapp.js'
      - 'web/**'
      - 'test/web-password-*.test.mjs'
      - '.github/workflows/alpha-web-password-auth.yml'
permissions:
  contents: read
jobs:
  password-account-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and deployment rules
        run: |
          node --check src/neon/web-password-auth.js
          node --check src/neon/web-password-accounts.js
          node --check src/neon/web-api.js
          node --check src/neon/render-whatsapp.js
          node --check web/app.js
          node --check web/racing-ui.js
          node --check web/clan-siege-ui.js
          node -e "const v=require('./web/vercel.json');if(!v.rewrites.some(x=>x.source==='/api/v1/:path*'))process.exit(1)"
      - name: Password hashing and cross-account isolation
        run: node --test test/web-password-auth.test.mjs test/web-password-accounts-isolation.test.mjs test/web-rich-ui-preservation.test.mjs
